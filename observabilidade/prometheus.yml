# ATLAS BRASIL — Prometheus scrape (Fase 4)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: atlas-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8000"
          - "host.docker.internal:8001"
        labels:
          service: atlas-api
          region: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
